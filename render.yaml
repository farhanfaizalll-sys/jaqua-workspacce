services:
  - type: web
    name: jaqua-backend
    runtime: node
    rootDir: jaqua_backend
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: NODE_VERSION
        value: 20.18.0
      # Database pakai Neon.tech (eksternal, gratis) - bukan Render Postgres,
      # karena akun ini cuma boleh 1 database gratis di Render (sudah kepakai
      # larvix-db). Isi manual di Render dashboard dengan connection string
      # dari Neon (sudah termasuk ?sslmode=require dari Neon sendiri).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Public broker for early hardware bring-up — swap for a private
      # broker + credentials before real deployment (see .env.example).
      - key: MQTT_BROKER_URL
        value: "mqtt://broker.emqx.io:1883"
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
